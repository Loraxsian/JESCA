<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="jaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Rounded Base Badge -->
  <rect width="64" height="64" rx="16" fill="url(#jaGrad)" filter="url(#shadow)"/>
  <!-- Decorative Accent Ring -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- JA Letters Monogram -->
  <text x="32" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">JA</text>
  <!-- Mini Sparkle/Dot Accent -->
  <circle cx="50" cy="18" r="3.5" fill="#60a5fa"/>
  <circle cx="50" cy="18" r="2" fill="#ffffff"/>
</svg>
